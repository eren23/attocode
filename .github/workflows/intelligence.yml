name: Intelligence
on:
  pull_request:
    paths: ['packages/code-intel/**', 'eval/quality/**', 'frontend/**', 'docker/code-intel/**', 'pyproject.toml', 'uv.lock', 'docs/intelligence-tools.md', '.github/workflows/intelligence.yml', '.github/workflows/release-intelligence.yml']
  push:
    branches: [main]
    paths: ['packages/code-intel/**', 'eval/quality/**', 'frontend/**', 'docker/code-intel/**', 'pyproject.toml', 'uv.lock', 'docs/intelligence-tools.md', '.github/workflows/intelligence.yml', '.github/workflows/release-intelligence.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  INTELLIGENCE_BASELINE: '0.1.15'

concurrency:
  group: intelligence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intelligence
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/intelligence
      QUALITY_TEST_SYSTEMD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --package attocode-code-intel --extra dev --extra service
      - name: Synthetic experiment infrastructure controls
        run: uv run --no-sync python -m eval.quality.experiments preflight --root '${{ runner.temp }}/experiment-preflight'
      - name: Apply all migrations
        run: uv run --no-sync python -c 'import asyncio, os; from attocode_intel.api.app import _run_migrations; asyncio.run(_run_migrations(os.environ["TEST_DATABASE_URL"]))'
      - name: Product tests with PostgreSQL
        run: uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml --confcutdir=packages/code-intel/tests packages/code-intel/tests --ignore=packages/code-intel/tests/unit --ignore=packages/code-intel/tests/integration -p eval.quality.no_agent -q -p eval.quality.coverage --quality-operations=quality-artifacts/operations.json --junitxml=quality-artifacts/product.xml
      - name: Bounded local quality gate
        run: uv run --no-sync python -m eval.quality local
      - name: Catalog stays synchronized
        run: |
          uv run --no-sync python packages/code-intel/scripts/generate_catalog.py
          git diff --exit-code -- docs/intelligence-tools.md
      - name: Build and verify standalone wheel
        run: |
          uv build --package attocode-code-intel
          uv venv /tmp/intelligence-wheel
          uv pip install --python /tmp/intelligence-wheel/bin/python attocode-code-intel==0.1.5
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_upgrade.py prepare '/tmp/intelligence upgrade project'
          uv pip install --reinstall-package attocode-code-intel --python /tmp/intelligence-wheel/bin/python dist/attocode_code_intel-*.whl
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_upgrade.py verify '/tmp/intelligence upgrade project'
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_wheel.py
      - name: Maintained clean and previous-version upgrade verification
        run: |
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("packages/code-intel/pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-sync python packages/code-intel/scripts/check_release.py candidate \
            --version "$release_version" --baseline-version "$INTELLIGENCE_BASELINE" \
            --source . --wheel "dist/attocode_code_intel-${release_version}-py3-none-any.whl" \
            --sdist "dist/attocode_code_intel-${release_version}.tar.gz" \
            --allow-downloads --report quality-artifacts/candidate-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-${{ matrix.python }}
          retention-days: 7
          path: |
            dist/
            quality-artifacts/
            ${{ runner.temp }}/experiment-preflight/evidence/
            .attocode/quality/runs/*/*.json
            .attocode/quality/runs/*/*.log
            .attocode/quality/runs/*/*.xml
          include-hidden-files: true
  wheel-macos:
    # The release builds on Linux. This job installs the same pure-Python wheel on macOS.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build and verify standalone wheel
        run: |
          uv build --package attocode-code-intel
          uv venv /tmp/intelligence-wheel
          uv pip install --python /tmp/intelligence-wheel/bin/python attocode-code-intel==0.1.5
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_upgrade.py prepare '/tmp/intelligence upgrade project'
          uv pip install --reinstall-package attocode-code-intel --python /tmp/intelligence-wheel/bin/python dist/attocode_code_intel-*.whl
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_upgrade.py verify '/tmp/intelligence upgrade project'
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_wheel.py
  optional-grammars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --package attocode-code-intel --extra dev --extra tree-sitter-all
      - name: Explicit acquisition and all adapter checks in disposable storage
        env:
          QUALITY_ALLOW_DOWNLOADS: '1'
        run: uv run --no-sync python packages/code-intel/scripts/check_optional_grammars.py --cache '${{ runner.temp }}/quality-grammars'
  real-language-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache: false
      - run: |
          npm install --global typescript@5.9.3 typescript-language-server@5.1.3 pyright@1.1.409
          go install golang.org/x/tools/gopls@v0.21.0
          rustup toolchain install 1.94.1 --profile minimal --component rust-analyzer --component rust-src
          rustup default 1.94.1
      - run: uv sync --locked --package attocode-code-intel --extra dev
      - name: Real servers with bounded warmup, identity, edit and shutdown checks
        env:
          QUALITY_REQUIRE_REAL_LSP: '1'
          QUALITY_REAL_LSP_LANGUAGES: python,go,rust
          QUALITY_LSP_TRACE_DIR: quality-artifacts
          RA_LOG: rust_analyzer=info
          CARGO_NET_OFFLINE: 'true'
          GOPROXY: 'off'
        run: uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml --confcutdir=packages/code-intel/tests packages/code-intel/tests/test_real_language_server.py -q --junitxml=quality-artifacts/real-servers.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-language-server-results
          retention-days: 7
          path: quality-artifacts/
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Compare equivalent runtime images on this runner
        run: uv run --with httpx --no-project python -m eval.quality.image_budget --report '${{ runner.temp }}/image-budget/report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-image-results
          retention-days: 14
          path: ${{ runner.temp }}/image-budget/
