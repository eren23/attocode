name: Release intelligence
on:
  push:
    tags: ['intel-v*']
permissions:
  contents: read
jobs:
  engine:
    uses: ./.github/workflows/ci.yml
  checks:
    uses: ./.github/workflows/intelligence.yml
  # The beta release checks quality and install health. The agent speed evidence of
  # release_gate.py is needed only for a speed claim (docs/intelligence-release.md).
  ranking:
    uses: ./.github/workflows/ranking-gate.yml
  build:
    needs: [checks, ranking, engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Validate tag
        # A retry tag preserves the original failed tag when CI needs repair.
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("packages/code-intel/pyproject.toml", "rb"))["project"]["version"]
          assert re.fullmatch(r"intel-v" + re.escape(version) + r"(?:-retry\.[1-9][0-9]*)?", os.environ["GITHUB_REF_NAME"])
          PY
      - run: uv sync --locked --package attocode-code-intel --extra dev --extra service
      - run: uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml --confcutdir=packages/code-intel/tests packages/code-intel/tests -p eval.quality.no_agent -q
      - run: uv build --package attocode-code-intel
      - name: Verify wheel without the agent
        run: |
          uv venv /tmp/intelligence-wheel
          uv pip install --python /tmp/intelligence-wheel/bin/python dist/attocode_code_intel-*.whl
          /tmp/intelligence-wheel/bin/python packages/code-intel/scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: intelligence-dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-intelligence
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intelligence-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  published-verification:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTELLIGENCE_BASELINE: '0.1.20'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --package attocode-code-intel
      - name: Verify actual PyPI clean install and previous-version upgrade
        run: |
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("packages/code-intel/pyproject.toml", "rb"))["project"]["version"])')"
          uv run --no-sync python packages/code-intel/scripts/check_release.py published \
            --version "$release_version" --baseline-version "$INTELLIGENCE_BASELINE" \
            --source . --allow-downloads --report quality-artifacts/published-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-published-verification
          retention-days: 30
          path: quality-artifacts/
