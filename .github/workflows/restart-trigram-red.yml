name: Raw restart freshness regressions
on:
  push:
    branches: [fix/restart-trigram-freshness]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATTOCODE_INTEL_PRECISION: 'off'
      ATTOCODE_INTEL_RANKING_PROVIDER: 'off'
      ATTOCODE_NL_EMBEDDING_MODE: 'none'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --package attocode-code-intel --extra dev
      - name: Run targeted tests
        run: |
          mkdir -p results
          uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml \
            --confcutdir=packages/code-intel/tests -q --junitxml=results/regression.xml \
            packages/code-intel/tests/test_trigram_restart_freshness.py \
            packages/code-intel/tests/test_trigram_freshness{,_scope,_edges,_modes}.py \
            packages/code-intel/tests/test_trigram_workspace.py \
            packages/code-intel/tests/unit/integrations/context/test_trigram_index.py \
            packages/code-intel/tests/unit/code_intel/test_search_tools.py \
            packages/code-intel/tests/test_keyword_prefilter_soundness.py > results/pytest.log 2>&1
      - name: Verify first calls from the candidate wheel
        run: |
          uv build --package attocode-code-intel --wheel
          uv pip install --python .venv/bin/python --no-deps --reinstall-package attocode-code-intel dist/attocode_code_intel-0.1.38-py3-none-any.whl
          sha256sum dist/attocode_code_intel-0.1.38-py3-none-any.whl > results/candidate-wheel.sha256
          .venv/bin/python eval/quality/restart_trigram_audit.py results > results/stdio.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-trigram-regressions-original
          path: results/
          if-no-files-found: error
          retention-days: 14
