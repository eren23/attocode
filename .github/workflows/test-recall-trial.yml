name: Test-recall trial
# One frozen trial of ATTOCODE_INTEL_TEST_RECALL: both arms run the same engine,
# local only, and differ only by that flag. No secrets.
on:
  workflow_dispatch:
    inputs:
      design:
        description: Path of the frozen question design
        required: true
      design_sha256:
        description: SHA-256 of the design file
        required: true

permissions:
  contents: read

concurrency:
  group: test-recall-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ATTOCODE_LOCAL_ONLY: '1'
      DESIGN: ${{ inputs.design }}
      DESIGN_SHA256: ${{ inputs.design_sha256 }}
    steps:
      # The runner context is not available in job-level env.
      - run: echo "TRIAL_ROOT=$RUNNER_TEMP/test-recall-trial" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Check the frozen design
        run: echo "$DESIGN_SHA256  $DESIGN" | sha256sum --check --strict
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install maintained test dependencies
        timeout-minutes: 5
        run: uv sync --locked --package attocode-code-intel --extra dev
      - name: Materialize the pinned public sources, one copy per arm
        timeout-minutes: 15
        env:
          QUALITY_ALLOW_DOWNLOADS: '1'
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          import yaml
          from eval.quality.corpus import materialize
          root = Path(os.environ['TRIAL_ROOT'])
          design = json.loads(Path(os.environ['DESIGN']).read_text())
          specs = {s['id']: s for s in yaml.safe_load(Path('eval/quality/workflows.yaml').read_text())['repositories']}
          for group in design['repositories']:
              spec = specs[group['pack']]
              assert spec['commit'] == group['commit'] and not spec.get('include') and not spec.get('subdir')
              materialize(spec, root / 'baseline' / group['pack'], root / 'cache')
              shutil.copytree(root / 'baseline' / group['pack'], root / 'candidate' / group['pack'], symlinks=True)
          PY
          mkdir -p "$TRIAL_ROOT/obs/baseline" "$TRIAL_ROOT/obs/candidate"
      - name: Baseline arm
        timeout-minutes: 15
        run: |
          for pack in $(jq -r '.repositories[].pack' "$DESIGN"); do
            uv run --no-sync python -m eval.quality.mcp_search --questions "$DESIGN" \
              --source "$(realpath "$TRIAL_ROOT/baseline/$pack")" --output "$TRIAL_ROOT/obs/baseline/$pack.json" \
              --pack "$pack" --arm baseline --warmup-timeout 300
          done
      - name: Candidate arm (ATTOCODE_INTEL_TEST_RECALL=1)
        timeout-minutes: 15
        env:
          ATTOCODE_INTEL_TEST_RECALL: '1'
        run: |
          for pack in $(jq -r '.repositories[].pack' "$DESIGN"); do
            uv run --no-sync python -m eval.quality.mcp_search --questions "$DESIGN" \
              --source "$(realpath "$TRIAL_ROOT/candidate/$pack")" --output "$TRIAL_ROOT/obs/candidate/$pack.json" \
              --pack "$pack" --arm candidate --warmup-timeout 300
          done
      - name: Decide on the frozen gates
        run: |
          uv run --no-sync python -m eval.quality.test_recall_trial decide --design "$DESIGN" \
            --baseline "$TRIAL_ROOT/obs/baseline" --candidate "$TRIAL_ROOT/obs/candidate" \
            --output "$TRIAL_ROOT/decision.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-recall-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-recall-trial/obs
            ${{ runner.temp }}/test-recall-trial/decision.json
          if-no-files-found: warn
