name: Focused live vector verification (temporary proof branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATTOCODE_LOCAL_ONLY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --package attocode-code-intel --extra dev --extra tree-sitter-all
      - name: Live routes, revisions and existing semantic controls
        run: >-
          uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml
          --confcutdir=packages/code-intel/tests -p eval.quality.no_agent -q
          packages/code-intel/tests/test_live_vector_freshness.py
          packages/code-intel/tests/test_vector_revision_lifecycle.py
          packages/code-intel/tests/test_go_semantic_chunks.py
          packages/code-intel/tests/test_quality_lifecycle.py
          packages/code-intel/tests/test_chunk_identity.py
          packages/code-intel/tests/unit/integrations/context/test_semantic_search.py
          packages/code-intel/tests/unit/integrations/context/test_body_chunking.py
          packages/code-intel/tests/unit/integrations/context/test_model_mismatch.py
          --junitxml=focused.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-vector-focused
          path: focused.xml
          if-no-files-found: error
