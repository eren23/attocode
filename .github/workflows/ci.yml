name: Focused Go search identity verification (temporary proof branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ATTOCODE_LOCAL_ONLY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --package attocode-code-intel --extra dev --extra service --extra tree-sitter-all
      - name: Actual native Go identity, fusion, cache and lifecycle controls
        run: >-
          uv run --no-sync python -m pytest -c packages/code-intel/pyproject.toml
          --confcutdir=packages/code-intel/tests
          packages/code-intel/tests/test_go_search_identity.py
          packages/code-intel/tests/test_go_search_boundaries.py
          packages/code-intel/tests/test_go_semantic_chunks.py
          packages/code-intel/tests/test_live_vector_freshness.py
          packages/code-intel/tests/test_vector_revision_lifecycle.py
          packages/code-intel/tests/test_chunk_identity.py
          packages/code-intel/tests/test_quality_lifecycle.py
          packages/code-intel/tests/test_cold_index_cost.py
          packages/code-intel/tests/test_lexical_sql_cost.py
          packages/code-intel/tests/test_search_budget_repair.py
          packages/code-intel/tests/unit/integrations/context/test_semantic_search.py
          packages/code-intel/tests/unit/integrations/context/test_body_chunking.py
          packages/code-intel/tests/unit/integrations/context/test_model_mismatch.py
          packages/code-intel/tests/unit/context/test_vector_store_dim_safety.py
          packages/code-intel/tests/unit/context/test_embedding_rotation.py
          packages/code-intel/tests/unit/integrations/context/test_query_routing.py
          -p eval.quality.no_agent -q --junitxml=focused.xml
      - name: Source files remain unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-search-identity-focused
          path: focused.xml
          if-no-files-found: error
          retention-days: 14
