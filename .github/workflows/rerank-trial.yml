name: Hosted rerank trial
# One frozen trial (packages/code-intel/evals/designs/2026-11-hosted-rerank.json).
# Dispatch only, so the secret never reaches pull requests from forks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerank-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Holds OPENROUTER_API_KEY: a dedicated key with a $5 credit limit (the hard spend cap).
    environment: rerank-trial
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DESIGN: packages/code-intel/evals/designs/2026-11-hosted-rerank.json
    steps:
      # The runner context is not available in job-level env.
      - run: echo "TRIAL_ROOT=$RUNNER_TEMP/rerank-trial" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install maintained test dependencies
        timeout-minutes: 5
        run: uv sync --locked --package attocode-code-intel --extra dev
      - name: Materialize the pinned public sources, one copy per arm
        timeout-minutes: 10
        env:
          QUALITY_ALLOW_DOWNLOADS: '1'
          ATTOCODE_LOCAL_ONLY: '1'
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          import yaml
          from eval.quality.corpus import materialize
          root = Path(os.environ['TRIAL_ROOT'])
          design = json.loads(Path(os.environ['DESIGN']).read_text())
          specs = {s['id']: s for s in yaml.safe_load(Path('eval/quality/workflows.yaml').read_text())['repositories']}
          for group in design['repositories']:
              spec = specs[group['pack']]
              assert spec['commit'] == group['commit'] and not spec.get('include') and not spec.get('subdir')
              materialize(spec, root / 'baseline' / group['pack'], root / 'cache')
              shutil.copytree(root / 'baseline' / group['pack'], root / 'candidate' / group['pack'], symlinks=True)
          PY
          mkdir -p "$TRIAL_ROOT/obs/baseline" "$TRIAL_ROOT/obs/candidate"
      - name: Baseline arm (local only, no hosted calls)
        timeout-minutes: 12
        env:
          ATTOCODE_LOCAL_ONLY: '1'
        run: |
          for pack in $(jq -r '.repositories[].pack' "$DESIGN"); do
            uv run --no-sync python -m eval.quality.mcp_search --questions "$DESIGN" \
              --source "$(realpath "$TRIAL_ROOT/baseline/$pack")" --output "$TRIAL_ROOT/obs/baseline/$pack.json" \
              --pack "$pack" --arm baseline --max-rerank-calls 0 --warmup-timeout 300
          done
      - name: Key usage before the candidate arm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          curl -fsS --max-time 30 -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key \
            | jq '.data | {usage, limit, limit_remaining}' > "$TRIAL_ROOT/usage-before.json"
          jq -e '.usage != null and .limit != null and .limit <= 5' "$TRIAL_ROOT/usage-before.json"
      - name: Candidate arm (hosted rerank for the pinned source only)
        timeout-minutes: 15
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ATTOCODE_INTEL_RANKING_PROVIDER: systemone
          ATTOCODE_INTEL_RANKING_ENDPOINT: https://openrouter.ai/api/alpha/decisions
          ATTOCODE_INTEL_RANKING_MODEL: typesafe/jev-1.13
          ATTOCODE_INTEL_RANKING_AUTH_ENV: OPENROUTER_API_KEY
          ATTOCODE_INTEL_RANKING_TIMEOUT_MS: '1500'
          ATTOCODE_INTEL_RANKING_ALLOW_REMOTE: '1'
        run: |
          for pack in $(jq -r '.repositories[].pack' "$DESIGN"); do
            source="$(realpath "$TRIAL_ROOT/candidate/$pack")"
            ATTOCODE_INTEL_RANKING_REMOTE_WORKSPACE="$source" uv run --no-sync python -m eval.quality.mcp_search \
              --questions "$DESIGN" --source "$source" --output "$TRIAL_ROOT/obs/candidate/$pack.json" \
              --pack "$pack" --arm candidate --samples-may-differ --require-rerank --max-rerank-calls 100 \
              --warmup-timeout 300
          done
      - name: Key usage after the candidate arm (after the settlement window)
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          sleep 60
          curl -fsS --max-time 30 -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/key \
            | jq '.data | {usage, limit, limit_remaining}' > "$TRIAL_ROOT/usage-after.json"
      - name: Decide on the frozen gates
        run: |
          uv run --no-sync python -m eval.quality.rerank_trial --design "$DESIGN" \
            --baseline "$TRIAL_ROOT/obs/baseline" --candidate "$TRIAL_ROOT/obs/candidate" \
            --usage-before "$TRIAL_ROOT/usage-before.json" --usage-after "$TRIAL_ROOT/usage-after.json" \
            --output "$TRIAL_ROOT/decision.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerank-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rerank-trial/obs
            ${{ runner.temp }}/rerank-trial/usage-*.json
            ${{ runner.temp }}/rerank-trial/decision.json
          if-no-files-found: warn
