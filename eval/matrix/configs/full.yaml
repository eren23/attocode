      redis: 20f163eb3dcc1311cfe6c0dda5a3beef08ab1a5d
    languages: {attocode: python, fastapi: python, gh-cli: go, pandas: python, redis: c}
  broad_external:
    primary: acc5
    public: true
    commits:
      express: 6c4249feec8ab40631817c8e7001baf2ed022224
      phoenix: 850162d618cf4e31be82fb53ad6e259095fa6126
      requests: ebf71906798ec82f34e07d3168f8b8aecaf8a3be
      ripgrep: 4519153e5e461527f4bca45b042fff45c4ec6fb9
      vapor: ff88583e10f02aa47be49e632d5179f89e855e03
    languages: {express: javascript, phoenix: elixir, requests: python, ripgrep: rust, vapor: swift}
  broad_holdout:
    primary: acc5
    public: true
    commits:
