site_name: Attocode
site_description: Codebase intelligence for coding agents and teams
site_url: https://eren23.github.io/attocode/
repo_url: https://github.com/eren23/attocode
repo_name: eren23/attocode

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Intelligence Product: intelligence.md
  - Tool Catalog: intelligence-tools.md
  - Search: intelligence-search.md
  - CLI: cli-reference.md
  - Architecture: ARCHITECTURE.md
  - Service Architecture: architecture-v2.md
  - HTTP API: code-intel-http-api.md
  - Quality and Validation:
      - Quality Controller: intelligence-quality.md
      - Validation: intelligence-validation.md
      - Workstream: intelligence-workstream.md
      - Releases: intelligence-release.md
  - Development:
      - Contributing: contributing.md
      - Testing: TESTING.md
      - Local Setup: guides/local-development.md
  - Archived Agent: legacy-agent.md

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid-init.js

plugins:
  - search

# Local, ignored planning notes are never part of the documentation site.
exclude_docs: |
  superpowers/
