# Final post-tuning validation pack: five repositories not used in either
# development case pack. Direct implementation targets fixed before searching.
repos:
  faker:
    - query: street address
      relevant_files:
        - lib/faker/default/address.rb
    - query: internet email
      relevant_files:
        - lib/faker/default/internet.rb
    - query: random names
      relevant_files:
        - lib/faker/default/name.rb
    - query: date generation
      relevant_files:
        - lib/faker/default/date.rb
  starship:
