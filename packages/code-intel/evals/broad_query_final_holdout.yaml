      relevant_files:
        - src/modules/git_status.rs
        - src/configs/git_status.rs
    - query: prompt formatting
      relevant_files:
        - src/formatter/string_formatter.rs
        - src/module.rs
    - query: config loading
      relevant_files:
        - src/config.rs
    - query: memory display
      relevant_files:
        - src/modules/memory_usage.rs
        - src/configs/memory_usage.rs
