    - query: json serialization
      relevant_files:
        - src/google/protobuf/json/json.cc
        - src/google/protobuf/json/internal/unparser.cc
    - query: wire encoding
      relevant_files:
        - src/google/protobuf/wire_format.cc
    - query: field descriptors
      relevant_files:
        - src/google/protobuf/descriptor.cc
  prisma:
    - query: client generation
      relevant_files:
        - packages/client-generator-js/src/TSClient/TSClient.ts
        - packages/client-generator-ts/src/TSClient/TSClient.ts
    - query: query serialization
      relevant_files:
        - packages/client/src/runtime/core/jsonProtocol/serializeJsonQuery.ts
    - query: interactive transactions
      relevant_files:
