# Development workspace only. The publishable product is packages/code-intel.
[tool.uv.workspace]
members = ["packages/code-intel"]

[tool.uv.sources]
attocode-code-intel = { workspace = true }

[dependency-groups]
dev = ["attocode-code-intel[dev,service]"]

[tool.pytest.ini_options]
testpaths = ["packages/code-intel/tests"]
asyncio_mode = "auto"
pythonpath = ["packages/code-intel/src", "."]
markers = [
    "slow: bounded slow or optional dependency checks",
    "integration: tests that use real services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Test data: intentional violations and sample projects that tests read verbatim.
extend-exclude = ["packages/code-intel/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "SIM105"]
